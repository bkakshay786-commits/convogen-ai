
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - ConvoGen AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #eaf8fa, #f5faff, #e6f5f7);
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 40px;
            border-radius: 22px;
            box-shadow: 0 10px 40px rgba(18,61,90,0.12);
            text-align: center;
        }

        .brand-logo {
            display: block;
            width: 56px;
            height: 56px;
            object-fit: contain;
            border-radius: 14px;
            margin: 0 auto 14px;
        }

        .brand {
            color: #123d5a;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .brand span {
            color: #159eaa;
        }

        h2 {
            color: #123d5a;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #263b50;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 9px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dce5ec;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #16a6ad;
            box-shadow: 0 0 0 3px rgba(22,166,173,0.12);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg,#168eae,#19b5a5);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            color: #159ca5;
            text-decoration: none;
            font-weight: bold;
        }

        .footer {
            margin-top: 28px;
            color: #a0aec0;
            font-size: 12px;
        }
    </style>
<link rel="icon" type="image/webp" href="/convogen-logo.webp">
</head>

<body>

    <div class="container">

        <img class="brand-logo" src="/convogen-logo.webp" alt="ConvoGen AI logo">
        <div class="brand">ConvoGen <span>AI</span></div>

        <h2>Reset Your Password</h2>

        <p class="subtitle">
            Create a new password for your account.
        </p>

        <form id="resetForm">

            <div class="input-group">
                <label for="password">New Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter new password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm New Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button type="submit" id="resetButton">
                Update Password
            </button>

        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <a href="/login">Back to Sign In</a>

        <p class="footer">
            © 2026 ConvoGen AI. All rights reserved.
        </p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        "use strict";

        const SUPABASE_URL =
            "https://rzeqerwqexhwapicubxz.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable__O418iD2yMy6aFdDBrgj4g_-5_-clD0";

        const client = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY,
            {
                auth: {
                    flowType: "implicit",
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true
                }
            }
        );

        const form = document.getElementById("resetForm");
        const message = document.getElementById("message");
        const button = document.getElementById("resetButton");

        let recoverySessionReady = false;

        async function initializeRecovery() {
            try {
                const { data, error } = await client.auth.getSession();

                if (error) {
                    throw error;
                }

                if (!data.session) {
                    throw new Error(
                        "Your reset link is invalid or expired. Request a new password reset email."
                    );
                }

                recoverySessionReady = true;

            } catch (error) {
                message.style.color = "#d93025";
                message.textContent = error.message;
                button.disabled = true;
            }
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (!recoverySessionReady) {
                message.style.color = "#d93025";
                message.textContent =
                    "Your recovery session is not ready. Request a new reset link if necessary.";
                return;
            }

            if (password.length < 8) {
                message.style.color = "#d93025";
                message.textContent =
                    "Password must contain at least 8 characters.";
                return;
            }

            if (password !== confirmPassword) {
                message.style.color = "#d93025";
                message.textContent = "Passwords do not match.";
                return;
            }

            button.disabled = true;
            button.textContent = "Updating...";

            try {
                const { error } = await client.auth.updateUser({
                    password: password
                });

                if (error) {
                    throw error;
                }

                message.style.color = "#16803c";
                message.textContent =
                    "Password updated successfully! Redirecting to login...";

                await client.auth.signOut({ scope: "local" });

                setTimeout(() => {
                    window.location.replace("/login");
                }, 1800);

            } catch (error) {
                message.style.color = "#d93025";
                message.textContent =
                    error.message || "Unable to update your password.";

                button.disabled = false;
                button.textContent = "Update Password";
            }
        });

        initializeRecovery();
    </script>

</body>
</html>
