
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ConvoGen AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #eaf8fa, #f5faff, #e6f5f7);
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 40px;
            border-radius: 22px;
            box-shadow: 0 10px 40px rgba(18,61,90,0.12);
            text-align: center;
        }

        .brand-logo {
            display: block;
            width: 56px;
            height: 56px;
            object-fit: contain;
            border-radius: 14px;
            margin: 0 auto 14px;
        }

        .brand {
            color: #123d5a;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .brand span {
            color: #159eaa;
        }

        h2 {
            color: #123d5a;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            font-size: 14px;
            color: #263b50;
            margin-bottom: 9px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dce5ec;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            margin-bottom: 20px;
        }

        input:focus {
            border-color: #16a6ad;
            box-shadow: 0 0 0 3px rgba(22,166,173,0.12);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg,#168eae,#19b5a5);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            color: #159ca5;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .footer {
            margin-top: 28px;
            color: #a0aec0;
            font-size: 12px;
        }
    </style>
<link rel="icon" type="image/webp" href="/convogen-logo.webp">
</head>

<body>

    <div class="container">

        <img class="brand-logo" src="/convogen-logo.webp" alt="ConvoGen AI logo">
        <div class="brand">ConvoGen <span>AI</span></div>

        <h2>Forgot Password?</h2>

        <p class="subtitle">
            Enter your registered email address.
            We'll send you instructions to reset your password.
        </p>

        <form id="forgotForm">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your registered email"
                autocomplete="email"
                required
            >

            <button type="submit" id="submitButton">
                Send Reset Link
            </button>

        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <a href="/login">Back to Sign In</a>

        <p class="footer">
            © 2026 ConvoGen AI. All rights reserved.
        </p>

    </div>

    <script>
        "use strict";

        const form = document.getElementById("forgotForm");
        const message = document.getElementById("message");
        const button = document.getElementById("submitButton");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();

            button.disabled = true;
            button.textContent = "Sending...";
            message.textContent = "";

            try {
                const response = await fetch("/forgot-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams({ email })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || "Unable to send reset email.");
                }

                message.style.color = "#16803c";
                message.textContent = result.message;

            } catch (error) {
                message.style.color = "#d93025";
                message.textContent = error.message;
            } finally {
                button.disabled = false;
                button.textContent = "Send Reset Link";
            }
        });
    </script>

</body>
</html>
